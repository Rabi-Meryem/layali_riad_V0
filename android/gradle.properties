# Configuration mémoire (optimisée pour les machines modernes)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX (obligatoire pour Firebase)
android.useAndroidX=true
android.enableJetifier=true

# Optimisations Gradle
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Spécifique à Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Configuration Flutter/Firebase
flutter.enableR8=true
firebase.autoInit=true
android.nonTransitiveRClass=true
# android.enableBuildCache=true

# Désactivation des features dépréciées
#android.enableSeparateAnnotationProcessing=true